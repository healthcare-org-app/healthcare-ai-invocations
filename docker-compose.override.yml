services:
  ai-invocations-service:
    build: .
    container_name: ${NAME_UNDERSCORE}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://healthcare:healthcare_dev@postgres:5432/ai_agents
      KAFKA_BOOTSTRAP: kafka:9092
      SERVICE_HOST_MODE: docker
      PORT_AI_AGENTS_SERVICE: "9100"
      PORT_ML_MODELS_SERVICE: "9104"
      PORT_PATIENT_CONSENT_SERVICE: "8102"
      PORT_AUDIT_LOG_SERVICE: "8007"
      LOG_LEVEL: INFO
    ports:
      - "9101:9101"
    networks:
      - healthcare_net
    volumes:
      - ../../libs/py-healthcare-common:/opt/py-healthcare-common:ro
    command: >
      sh -c "pip install -e /opt/py-healthcare-common && python -m app.main"
